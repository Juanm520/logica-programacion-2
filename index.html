<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script type="module" src="./main.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <title>Conversion Temperatura</title>
</head>

<body>

    <main class="d-flex justify-content-center m-8 max-w-30">
        <section class="card m-8 w-50 bg-info">
            <h1 class="fw-bold p-2">Conversión de temperaturas</h1>

            <label class="form-control form-adorn form-adorn-end">
                Escriba la temperatura en c°
                <input id="input_temperatura" type="text" name="input_temp" placeholder="0 °C" class="form-ghost">
            </label>


            <section class="card mt-10 w-50 resultadosDisplay bg-muted-info">
                <h2> Conversión: </h2>
                <h3 class="resultadoK"> 0 °K </h3>
                <h3 class="resultadoF"> 0 °F </h3>
            </section>
        </section>


    </main>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

</body>

</html>
